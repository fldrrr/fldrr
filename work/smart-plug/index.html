<style>
html,body{margin:0;background:#020910}
body{min-height:100vh;display:flex;box-sizing:border-box;padding:24px 352px 24px 24px;overflow:auto}
#dc-root{margin:auto;flex-shrink:0;position:relative;width:390px;height:844px;box-shadow:0 30px 80px rgba(0,0,0,0.55)}
[data-screen]{position:absolute;inset:0;overflow:hidden;background:#061727}
[data-screen][hidden]{display:none}
.dc-root{position:absolute;left:0;top:0}
.tw{position:fixed;top:16px;right:16px;z-index:100;width:304px;max-height:calc(100vh - 32px);overflow:auto;box-sizing:border-box;border-radius:14px;background:rgba(14,20,28,0.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.12);box-shadow:0 20px 50px rgba(0,0,0,0.55);color:#f1f5f9;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;line-height:18px}

.tw-row{display:flex;flex-direction:column;gap:8px}

.tw-val{font-variant-numeric:tabular-nums;font-weight:600}
.tw input[type=range]{width:100%;height:20px;margin:0;cursor:pointer;accent-color:#0a84ff}
.tw-grad{height:6px;border-radius:3px}
.tw-lvl{display:flex;align-items:center;gap:8px;color:#cbd5e1}
.tw-dot{width:8px;height:8px;flex-shrink:0;border-radius:4px;background:#0a84ff}
.tw-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tw-card{min-height:36px;padding:4px 8px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#f1f5f9;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;text-align:left;cursor:pointer}
.tw-card[aria-pressed="true"]{border-color:#0a84ff;background:rgba(10,132,255,0.22)}
.tw-card>span:last-child{display:flex;flex-direction:column}
.tw-sub{font-size:11px;font-weight:500;color:#94a3b8}
.tw-note{font-size:12px;color:#94a3b8}
.tw-seg{display:grid;gap:4px;padding:3px;border-radius:10px;background:rgba(255,255,255,0.06)}
.tw-seg button{min-height:34px;border-radius:8px;border:0;background:transparent;color:#cbd5e1;font-size:12px;font-weight:600;cursor:pointer}
.tw-seg button[aria-pressed="true"]{background:#0a84ff;color:#fff}
.tw-sw{position:relative;width:44px;height:26px;flex-shrink:0;border-radius:13px;border:0;padding:0;background:rgba(255,255,255,0.18);cursor:pointer;transition:background 200ms ease}
.tw-sw[aria-checked="true"]{background:#30d158}
.tw-sw>span{position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:transform 200ms ease}
.tw-sw[aria-checked="true"]>span{transform:translateX(18px)}
.tw-reset{min-height:30px;padding:0 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:transparent;color:#cbd5e1;font-size:12px;font-weight:600;cursor:pointer}
@media (max-width:760px){body{padding:44px 0 0}#dc-root{margin:0 auto;box-shadow:none}.tw{top:0;left:0;right:0;width:auto;max-height:70vh;border-radius:0 0 14px 14px;border-top:0}}
</style>
</head>
<body>
<div id="dc-root">
<div data-screen="status"><div class="dc-root" style="left:0px;top:0px"></div></div><div data-screen="usage" hidden><div class="dc-root" style="left:0px;top:0px"></div></div><div data-screen="schedule" hidden><div class="dc-root" style="left:0px;top:-40px"></div></div>
</div>
<aside class="tw" aria-label="Tweaks">
  <button type="button" id="tw-toggle" aria-expanded="true" aria-controls="tw-body">
    <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>Tweaks</span>
    <svg id="tw-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
  </button>
  <div id="tw-body">
<section class="tw-row"><div class="tw-head"><label for="tw-in-power">Pobór mocy</label><span class="tw-val" id="tw-out-power"></span></div><input id="tw-in-power" type="range" min="0" max="3680" step="10" value="1050" data-tw="power" data-unit="W"></section><section class="tw-row"><span class="tw-l" id="tw-l-stan">Gniazdo</span><div class="tw-seg" role="group" style="grid-template-columns:repeat(2, minmax(0, 1fr))"><button type="button" data-tw="stan" data-val="Włączone" aria-pressed="false">Włączone</button><button type="button" data-tw="stan" data-val="Wyłączone" aria-pressed="false">Wyłączone</button></div></section><section class="tw-row"><span class="tw-l" id="tw-l-tryb">Tryb pracy</span><div class="tw-seg" role="group" style="grid-template-columns:repeat(2, minmax(0, 1fr))"><button type="button" data-tw="tryb" data-val="Gniazdko" aria-pressed="false">Gniazdko</button><button type="button" data-tw="tryb" data-val="Pompa cyrkulacyjna" aria-pressed="false">Pompa cyrkulacyjna</button></div></section><section class="tw-row"><span class="tw-l" id="tw-l-kontrast">Kontrast</span><div class="tw-seg" role="group" style="grid-template-columns:repeat(2, minmax(0, 1fr))"><button type="button" data-tw="kontrast" data-val="Standardowy" aria-pressed="false">Standardowy</button><button type="button" data-tw="kontrast" data-val="Wysoki" aria-pressed="false">Wysoki</button></div></section><section class="tw-row"><span class="tw-l">Ekran</span><div class="tw-seg" role="group" style="grid-template-columns:minmax(0, 0.85fr) minmax(0, 0.85fr) minmax(0, 1.3fr)"><button type="button" data-tw="$screen" data-val="status" aria-pressed="false">Status</button><button type="button" data-tw="$screen" data-val="usage" aria-pressed="false">Zużycie</button><button type="button" data-tw="$screen" data-val="schedule" aria-pressed="false">Harmonogram</button></div></section><section class="tw-row tw-inline"><span class="tw-l" id="tw-l-harmonogram">Harmonogram</span><button type="button" class="tw-sw" role="switch" aria-checked="false" data-tw="harmonogram" aria-labelledby="tw-l-harmonogram"><span></span></button></section><section class="tw-row tw-inline"><span class="tw-l" id="tw-l-menu">Menu „⋯”</span><button type="button" class="tw-sw" role="switch" aria-checked="false" data-tw="menu" aria-labelledby="tw-l-menu"><span></span></button></section><section class="tw-row tw-inline"><span class="tw-l" id="tw-l-arkusz">Arkusz cyklu</span><button type="button" class="tw-sw" role="switch" aria-checked="false" data-tw="arkusz" aria-labelledby="tw-l-arkusz"><span></span></button></section><section class="tw-row tw-inline"><span class="tw-note">Stan początkowy</span><button type="button" class="tw-reset" id="tw-reset">Resetuj</button></section>
  </div>
</aside>
<template id="tpl-status">

<div id="st-top" class="{{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; font-family: 'Indivisible', 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--text); background-color: var(--bg); background-image: var(--bgimg);">

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(rgba(130,207,255,0.24) 1px, rgba(130,207,255,0) 1.5px); background-size: 20px 20px; -webkit-mask-image: radial-gradient(ellipse 85% 55% at 50% 32%, #000000 0%, rgba(0,0,0,0) 75%); mask-image: radial-gradient(ellipse 85% 55% at 50% 32%, #000000 0%, rgba(0,0,0,0) 75%); opacity: calc(0.55 * var(--decor));"></div>
  <svg aria-hidden="true" width="620" height="200" viewBox="0 0 620 200" style="position: absolute; left: -90px; top: 64px; pointer-events: none; transform-origin: 50% 50%; opacity: var(--decor); animation: drift 22s ease-in-out infinite alternate;">
    <path d="M0 100 C 70 40, 140 40, 210 100 S 350 160, 420 100 S 560 40, 630 100" fill="none" stroke="rgba(130,207,255,0.07)" stroke-width="1.2"></path>
    <path d="M0 116 C 70 56, 140 56, 210 116 S 350 176, 420 116 S 560 56, 630 116" fill="none" stroke="rgba(130,207,255,0.05)" stroke-width="1.2"></path>
    <path d="M0 132 C 70 72, 140 72, 210 132 S 350 192, 420 132 S 560 72, 630 132" fill="none" stroke="rgba(130,207,255,0.035)" stroke-width="1.2"></path>
  </svg>
  <svg aria-hidden="true" width="620" height="220" viewBox="0 0 620 220" style="position: absolute; left: -40px; top: 452px; pointer-events: none; opacity: var(--decor); animation: drift 18s ease-in-out infinite alternate-reverse;">
    <path d="M0 110 C 70 50, 140 50, 210 110 S 350 170, 420 110 S 560 50, 630 110" fill="none" stroke="rgba(130,207,255,0.13)" stroke-width="1.5"></path>
    <path d="M0 128 C 70 68, 140 68, 210 128 S 350 188, 420 128 S 560 68, 630 128" fill="none" stroke="rgba(130,207,255,0.1)" stroke-width="1.5"></path>
    <path d="M0 146 C 70 86, 140 86, 210 146 S 350 206, 420 146 S 560 86, 630 146" fill="none" stroke="rgba(130,207,255,0.07)" stroke-width="1.5"></path>
    <path d="M0 164 C 70 104, 140 104, 210 164 S 350 224, 420 164 S 560 104, 630 164" fill="none" stroke="rgba(130,207,255,0.045)" stroke-width="1.5"></path>
  </svg>

  <header style="position: relative; height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box; background: var(--hdr); border-bottom: 1px solid var(--hdrb); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); -webkit-mask-image: linear-gradient(180deg, #000000 0%, #000000 82%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(180deg, #000000 0%, #000000 82%, rgba(0,0,0,0) 100%);">
    <button aria-label="Wróć" style="width: 44px; height: 44px; border-radius: 8px; border: 0; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 16px; font-weight: 600; line-height: 20px;">Smart Plug 1</span>
      <span style="font-size: 12px; line-height: 16px; color: var(--sub);">Salon</span>
    </div>
    <button aria-label="Więcej opcji" aria-haspopup="dialog" aria-expanded="{{menuExp}}" onClick="{{openMenu}}" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--btn2b); background: var(--btn2); color: var(--btn2t); display: flex; align-items: center; justify-content: center; padding: 0; box-sizing: border-box; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
    </button>
  </header>

  <main style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px 16px 16px; box-sizing: border-box;">
    <div aria-live="polite" style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <span style="font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em;">{{statusText}}</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: var(--sub);">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: {{statusDot}}; box-shadow: {{chipGlow}}; transition: background 400ms ease;"></span>
        {{statusSub}}
      </span>
    </div>

    <div style="position: relative; width: 240px; height: 240px; margin-top: {{pumpMt}}px; flex-shrink: 0;">
      <div aria-hidden="true" style="position: absolute; left: -80px; top: -80px; width: 400px; height: 400px; opacity: {{ambientOp}}; transform: scale({{haloScale}}); transition: opacity 800ms ease, transform 1000ms cubic-bezier(0.2, 0.8, 0.2, 1);">
        <div style="width: 100%; height: 100%; border-radius: 50%; background: {{ambient}}; animation: {{breatheAnim}};"></div>
      </div>
      <div aria-hidden="true" style="position: absolute; left: 4px; top: 4px; width: 232px; height: 232px; opacity: {{auraOpacity}}; transform: scale({{haloScale}}); transition: opacity 600ms ease, transform 900ms cubic-bezier(0.34, 1.4, 0.64, 1);">
        <div style="width: 100%; height: 100%; border-radius: 50%; background: {{aurora}}; filter: blur(14px); animation: spin 9s linear infinite;"></div>
      </div>
      <div aria-hidden="true" style="position: absolute; inset: 0; opacity: {{wavesOp}}; transition: opacity 500ms ease;">
        <div style="position: absolute; left: 26px; top: 26px; width: 188px; height: 188px; border-radius: 50%; background: {{wave}}; animation: {{waveAnim}};"></div>
        <div style="position: absolute; left: 26px; top: 26px; width: 188px; height: 188px; border-radius: 50%; background: {{wave}}; animation: {{waveAnim2}};"></div>
      </div>
      <div aria-hidden="true" style="position: absolute; left: 26px; top: 26px; width: 188px; height: 188px; border-radius: 50%; border: 2px solid {{burstColor}}; box-sizing: border-box; opacity: 0; animation: {{burstAnim}};"></div>

      <button class="press" onClick="{{toggle}}" aria-pressed="{{pressed}}" aria-label="{{btnAria}}" style="position: absolute; left: 26px; top: 26px; width: 188px; height: 188px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: transparent; box-shadow: {{rim}}; transition: transform 160ms ease, box-shadow 600ms ease;">
        <sc-if value="{{isSocket}}" hint-placeholder-val="{{true}}">
          <span style="position: absolute; inset: 0; border-radius: 50%; background: var(--face);"></span>
          <span style="position: absolute; inset: 0; border-radius: 50%; background: var(--faceon); opacity: {{onOpacity}}; transition: opacity 550ms ease;"></span>
          <span style="position: absolute; left: 21px; top: 21px; width: 146px; height: 146px; border-radius: 50%; background: rgba(0,58,109,0.08); box-shadow: inset 0 3px 10px rgba(0,30,60,0.3);"></span>
          <span style="position: absolute; left: 86px; top: 49px; width: 16px; height: 16px; border-radius: 50%; background: {{holeColor}}; box-shadow: inset 0 2px 3px rgba(0,0,0,0.35); transition: background 500ms ease;"></span>
          <span style="position: absolute; left: 48px; top: 86px; width: 32px; height: 32px; border-radius: 50%; background: {{holeColor}}; box-shadow: inset 0 3px 5px rgba(0,0,0,0.4); transition: background 500ms ease;"></span>
          <span style="position: absolute; left: 108px; top: 86px; width: 32px; height: 32px; border-radius: 50%; background: {{holeColor}}; box-shadow: inset 0 3px 5px rgba(0,0,0,0.4); transition: background 500ms ease;"></span>
        </sc-if>
        <sc-if value="{{isPump}}" hint-placeholder-val="{{false}}">
          <svg aria-hidden="true" width="268" height="268" viewBox="0 0 224 224" style="position: absolute; left: -40px; top: -40px; overflow: visible;">
            <defs>
              <filter id="st-pGlowF" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="6"></feGaussianBlur>
              </filter>
              <linearGradient id="st-pPipe" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="{{pg.pipe0}}"></stop>
                <stop offset="0.45" stop-color="{{pg.pipe1}}"></stop>
                <stop offset="1" stop-color="{{pg.pipe2}}"></stop>
              </linearGradient>
              <linearGradient id="st-pBody" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="{{pg.body0}}"></stop>
                <stop offset="1" stop-color="{{pg.body1}}"></stop>
              </linearGradient>
              <radialGradient id="st-pRing" cx="0.35" cy="0.3" r="0.8">
                <stop offset="0" stop-color="{{pg.ring0}}"></stop>
                <stop offset="1" stop-color="{{pg.ring1}}"></stop>
              </radialGradient>
              <radialGradient id="st-pPlate" cx="0.4" cy="0.35" r="0.75">
                <stop offset="0" stop-color="{{pg.plate0}}"></stop>
                <stop offset="1" stop-color="{{pg.plate1}}"></stop>
              </radialGradient>
              <linearGradient id="st-pPlug" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="{{pg.plug0}}"></stop>
                <stop offset="1" stop-color="{{pg.plug1}}"></stop>
              </linearGradient>
            </defs>
            <g filter="url(#st-pGlowF)" fill="{{glowColor}}" stroke="{{glowColor}}" stroke-width="16" stroke-linejoin="round" style="opacity: {{auraOp}}; transition: opacity 500ms ease;">
              <rect x="100" y="30" width="24" height="166" rx="4"></rect>
              <rect x="90" y="22" width="44" height="20" rx="4"></rect>
              <rect x="90" y="182" width="44" height="20" rx="4"></rect>
              <circle cx="112" cy="114" r="60"></circle>
              <rect x="26" y="92" width="44" height="54" rx="9"></rect>
              <rect x="40" y="146" width="18" height="16" rx="4"></rect>
            </g>
            <g fill="{{glowColor}}" stroke="{{glowColor}}" stroke-width="8" stroke-linejoin="round" style="opacity: {{glowOp}}; transition: opacity 500ms ease;">
              <rect x="100" y="30" width="24" height="166" rx="4"></rect>
              <rect x="90" y="22" width="44" height="20" rx="4"></rect>
              <rect x="90" y="182" width="44" height="20" rx="4"></rect>
              <circle cx="112" cy="114" r="60"></circle>
              <rect x="26" y="92" width="44" height="54" rx="9"></rect>
              <rect x="40" y="146" width="18" height="16" rx="4"></rect>
            </g>
            <g style="filter: {{pumpShadow}};">
            <rect x="100" y="30" width="24" height="166" rx="4" fill="url(#st-pPipe)" stroke="{{pumpStroke}}" stroke-width="2"></rect>
            <rect x="90" y="22" width="44" height="20" rx="4" fill="url(#st-pPipe)" stroke="{{pumpStroke}}" stroke-width="2"></rect>
            <rect x="90" y="182" width="44" height="20" rx="4" fill="url(#st-pPipe)" stroke="{{pumpStroke}}" stroke-width="2"></rect>
            <path d="M96 28h32M96 35h32M96 188h32M96 195h32" stroke="{{ink}}" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round" fill="none"></path>
            <circle cx="112" cy="114" r="60" fill="url(#st-pRing)" stroke="{{pumpStroke}}" stroke-width="2"></circle>
            <circle cx="112" cy="114" r="60" fill="none" stroke="{{ink}}" stroke-opacity="0.12" stroke-width="1"></circle>
            <ellipse cx="76" cy="78" rx="15" ry="7" fill="#ffffff" opacity="{{hiOp}}" transform="rotate(-45 76 78)"></ellipse>
            <path d="M152 130V108M145 115l7-7 7 7" stroke="{{ink}}" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
            <rect x="26" y="92" width="44" height="54" rx="9" fill="url(#st-pBody)" stroke="{{pumpStroke}}" stroke-width="2"></rect>
            <rect x="34" y="102" width="18" height="12" rx="2.5" fill="{{ink}}" opacity="0.35"></rect>
            <rect x="40" y="146" width="18" height="16" rx="4" fill="url(#st-pPlug)"></rect>
            <rect x="45" y="162" width="8" height="10" rx="3" fill="{{ink}}"></rect>
            <circle cx="112" cy="114" r="46" fill="url(#st-pPlate)"></circle>
            <circle cx="112" cy="114" r="46" fill="none" stroke="{{ink}}" stroke-opacity="0.18" stroke-width="1.5"></circle>
            <g fill="{{ink}}" opacity="0.5">
              <rect x="80" y="90" width="40" height="3.5" rx="1.75"></rect>
              <rect x="80" y="99" width="28" height="3.5" rx="1.75"></rect>
              <rect x="80" y="128" width="22" height="3.5" rx="1.75"></rect>
              <rect x="80" y="137" width="34" height="3.5" rx="1.75"></rect>
              <rect x="122" y="130" width="16" height="11" rx="2"></rect>
            </g>
            <g style="transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; animation-play-state: {{impPlay}};">
              <circle cx="112" cy="114" r="16" fill="url(#st-pPlug)"></circle>
              <circle cx="112" cy="114" r="11.5" fill="{{plugFill}}"></circle>
              <rect x="102" y="112" width="20" height="4" rx="2" fill="{{ink}}"></rect>
            </g>
            </g>
          </svg>
        </sc-if>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" style="position: absolute; left: {{pwrLeft}}px; top: {{pwrTop}}px; overflow: visible;">
          <g transform="translate(0 1.2)" stroke="{{iconHi}}"><path d="M12 4v7"></path><path d="M6.8 7.2a7 7 0 1 0 10.4 0"></path></g>
          <g stroke="{{iconLo}}"><path d="M12 4v7"></path><path d="M6.8 7.2a7 7 0 1 0 10.4 0"></path></g>
        </svg>
        <sc-if value="{{pending}}" hint-placeholder-val="{{false}}">
          <svg width="{{spinSize}}" height="{{spinSize}}" viewBox="0 0 210 210" aria-hidden="true" style="position: absolute; left: {{spinOff}}px; top: {{spinOff}}px; animation: spin 900ms linear infinite;"><circle cx="105" cy="105" r="102" fill="none" stroke="{{spinColor}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="90 600"></circle></svg>
        </sc-if>
      </button>
    </div>

    <div style="position: relative; margin-top: {{metricMt}}px; display: flex; flex-direction: column; align-items: center; gap: {{metricGap}}px;">
      <span aria-live="polite" style="font-size: 12px; line-height: 16px; color: var(--sub);">{{metricLabel}}</span>
      <span style="display: flex; align-items: baseline; gap: 6px;">
        <span style="font-size: 44px; line-height: 48px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: {{powerColor}}; transition: color 400ms ease;">{{metricText}}</span>
        <span style="font-size: 18px; font-weight: 500; color: var(--sub);">{{metricUnit}}</span>
      </span>
      <span style="display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 14px; background: var(--chipbg); border: 1px solid {{chipBorder}}; font-size: 12px; font-weight: 600; transition: border-color 400ms ease;">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: {{chipDot}}; box-shadow: {{chipGlow}};"></span>
        {{levelText}}
      </span>
    </div>

    <sc-if value="{{isSocket}}" hint-placeholder-val="{{true}}">
      <a href="#screen-usage" style="width: 100%; margin-top: 22px; display: flex; flex-direction: column; gap: 10px; padding: 16px; box-sizing: border-box; border-radius: 16px; background: var(--card); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: var(--cardb); box-shadow: var(--cardsh); color: var(--text); text-decoration: none;">
        <span style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 12px; line-height: 16px; color: var(--sub);">Zużycie dziś</span>
          <span style="flex: 1;"></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--sub);"><path d="M9 6l6 6-6 6"></path></svg>
        </span>
        <span style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: -6px;">
          <span style="display: flex; align-items: baseline; gap: 4px;"><span style="font-size: 24px; line-height: 28px; font-weight: 600; font-variant-numeric: tabular-nums;">6,23</span><span style="font-size: 14px; color: var(--sub);">kWh</span></span>

    H[id] = new DCRuntime.Host(byId[id], stage, p || { $preview: {} });
  }
  function showScreen(id) {
    current = id;
    if (onShow[id] && H[id]) { try { onShow[id](H); } catch (e) { console.error(e); } }
    document.querySelectorAll('[data-screen]').forEach(function (el) { el.hidden = el.dataset.screen !== id; });
    sync();
  }
  window.__dcNavigate = showScreen;
  document.getElementById('dc-root').addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a) return;
    e.preventDefault();
    var h = a.getAttribute('href');
    if (h.indexOf('#screen-') === 0) showScreen(h.slice(8));
  });
  function fmt(n) { n = Math.round(n); return n >= 1000 ? Math.floor(n / 1000) + ' ' + String(n % 1000).padStart(3, '0') : String(n); }
  function sync() {
    var st = tweaks;
    if (read && H[main]) { try { var r = read(H) || {}; Object.keys(r).forEach(function (k) { if (r[k] !== undefined) tweaks[k] = r[k]; }); } catch (e) {} }
    document.querySelectorAll('[data-tw]').forEach(function (el) {
      var k = el.dataset.tw, v = k === '$screen' ? current : st[k];
      if (el.tagName === 'INPUT') {
        if (String(el.value) !== String(v)) el.value = v;
        var o = document.getElementById('tw-out-' + k); if (o) o.textContent = fmt(Number(v)) + (el.dataset.unit ? ' ' + el.dataset.unit : '');
        var f = fnCache[k];
        if (f) {
          var c = f.color ? f.color(Number(v)) : null, t = f.text ? f.text(Number(v)) : '';
          var dot = document.getElementById('tw-dot-' + k), lt = document.getElementById('tw-lvltext-' + k);
          if (dot && c) { dot.style.background = c; dot.style.boxShadow = '0 0 8px ' + c; el.style.accentColor = c; }
          if (lt) lt.textContent = t;
        }
        return;
      }
      if (el.dataset.val !== undefined) { el.setAttribute('aria-pressed', String(v) === el.dataset.val ? 'true' : 'false'); return; }
      if (el.getAttribute('role') === 'switch') el.setAttribute('aria-checked', v ? 'true' : 'false');
    });
  }
  function apply(k, v) {
    tweaks[k] = v;
    if (live[k] && H[main]) { try { live[k](v, H); } catch (e) { console.error(e); } }
    else { mountScreen(main, props()); showScreen(main); }
    sync();
  }
  document.querySelectorAll('[data-tw][data-val]').forEach(function (b) {
    b.addEventListener('click', function () {
      var k = b.dataset.tw, v = b.dataset.val;
      if (k === '$screen') { showScreen(v); return; }
      if (b.tagName === 'INPUT') return;
      var cur = DEF[k];
      if (typeof cur === 'number') v = Number(v); else if (typeof cur === 'boolean') v = v === 'true';
      apply(k, v);
    });
  });
  document.querySelectorAll('[data-tw][role="switch"]').forEach(function (b) { b.addEventListener('click', function () { apply(b.dataset.tw, !tweaks[b.dataset.tw]); }); });
  document.querySelectorAll('input[data-tw]').forEach(function (r) { r.addEventListener('input', function () { apply(r.dataset.tw, Number(r.value)); }); });
  document.getElementById('tw-reset').addEventListener('click', function () {
    tweaks = JSON.parse(JSON.stringify(DEF));
    D.screens.forEach(function (s, i) { mountScreen(s.id, i === 0 ? props() : null); });
    showScreen(main);
  });
  var head = document.getElementById('tw-toggle'), body = document.getElementById('tw-body');
  head.addEventListener('click', function () {
    var open = head.getAttribute('aria-expanded') !== 'true';
    head.setAttribute('aria-expanded', open ? 'true' : 'false');
    body.hidden = !open;
    document.getElementById('tw-chev').style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
  });
  D.screens.forEach(function (s, i) { mountScreen(s.id, i === 0 ? props() : null); });
  showScreen(main);
  setInterval(sync, 400);
})();
</script>
